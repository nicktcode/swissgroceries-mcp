name: Nightly live smoke

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/cache/restore@v4
        with:
          path: smoke-state.json
          key: smoke-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: smoke-state-

      # --retry keeps a single slow response from filing an issue.
      - name: Run live smoke
        id: smoke
        env:
          RUN_LIVE: '1'
          NO_COLOR: '1'
          SMOKE_UNAVAILABLE_LOG: smoke-unavailable.log
        run: |
          set -o pipefail
          npx vitest --run tests/smoke --retry=2 2>&1 | tee smoke.log
        continue-on-error: true

      - name: Update nightly-smoke issues
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = require('./.github/scripts/nightly-report.cjs');
            await report({ github, context, smokeFailed: '${{ steps.smoke.outcome }}' === 'failure' });

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: smoke-state.json
          key: smoke-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail job if smoke failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
